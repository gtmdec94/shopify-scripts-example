version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: b2b_reseller
      POSTGRES_USER: b2b_user
      POSTGRES_PASSWORD: b2b_password
    ports:
      - '5432:5432'
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b2b_user -d b2b_reseller']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: b2b-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - .docker-data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: b2b-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - .docker-data/minio:/data

  minio-init:
    image: minio/mc:latest
    container_name: b2b-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/b2b-uploads --ignore-existing;
      mc anonymous set download local/b2b-uploads;
      exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: b2b-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
